services:
  - type: web
    name: diario-aleto-bot
    runtime: docker
    plan: free
    region: oregon
    branch: prod
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash"
      - key: DEFAULT_WATCH_NAMES
        sync: false
      - key: CHECK_INTERVAL_MINUTES
        value: "60"
      - key: TIMEZONE
        value: "America/Araguaina"
      - key: DATA_DIR
        value: "/app/data"
      - key: DATABASE_URL
        sync: false
